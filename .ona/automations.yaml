tasks:
  installDeps:
    name: Install dependencies
    description: Install npm dependencies for the auth service.
    command: |
      npm ci || npm install
    triggeredBy:
      - postDevcontainerStart

  test:
    name: Run tests
    description: Run the test suite.
    command: |
      npm test
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  dev-server:
    name: Dev Server
    description: Run the auth service in development mode.
    commands:
      start: |
        npm run dev
      ready: |
        curl -sf http://localhost:3002/health
